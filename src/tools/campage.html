<!doctype html>
<meta charset="utf-8">
<title>Exo camera page</title>
<!-- SC-11's call app stand-in. Opens "Exo Camera", shows it, and counts the
     frames the track delivers with MediaStreamTrackProcessor, which keeps
     counting when the window is covered (requestVideoFrameCallback stops).
     Every 5s, and on any track event, it posts a line to campage.ps1. -->
<video id="v" autoplay muted playsinline style="width:640px"></video>
<pre id="s"></pre>
<script>
const shown = document.getElementById('s');
// Tells this page's lines from a page left open by an earlier run.
const page = Math.random().toString(36).slice(2, 8);
function post(o) {
  o.page = page;
  o.t = +(performance.now() / 1000).toFixed(3);
  o.vis = document.visibilityState;
  const line = JSON.stringify(o);
  fetch('/log', { method: 'POST', body: line }).catch(() => {});
  shown.textContent = (line + '\n' + shown.textContent).slice(0, 4000);
}

async function exoCamera() {
  let cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  // Labels are empty until the origin has camera permission in this session.
  if (cams.every(d => d.label === '')) {
    (await navigator.mediaDevices.getUserMedia({ video: true })).getTracks().forEach(t => t.stop());
    cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  }
  post({ ev: 'devices', cams: cams.map(d => d.label) });
  return cams.find(d => d.label.includes('Exo Camera'));
}

(async () => {
  try {
    // The hub may still be registering the camera; look again every 5s.
    let exo;
    while (!(exo = await exoCamera())) {
      post({ ev: 'no Exo Camera' });
      await new Promise(r => setTimeout(r, 5000));
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: exo.deviceId } } });
    const track = stream.getVideoTracks()[0];
    document.getElementById('v').srcObject = stream;
    post({ ev: 'open', label: track.label, settings: track.getSettings() });
    track.onended = () => post({ ev: 'ended' });
    track.onmute = () => post({ ev: 'mute' });
    track.onunmute = () => post({ ev: 'unmute' });

    let n = 0, w = 0, h = 0, t0 = performance.now();
    setInterval(() => {
      const t = performance.now();
      post({ ev: '5s', frames: n, fps: +(n * 1000 / (t - t0)).toFixed(2), w, h,
             state: track.readyState, muted: track.muted, settings: track.getSettings() });
      n = 0; t0 = t;
    }, 5000);

    const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) { post({ ev: 'reader done' }); break; }
      n++; w = value.displayWidth; h = value.displayHeight;
      value.close();
    }
  } catch (e) {
    post({ ev: 'error', what: String(e) });
  }
})();
</script>

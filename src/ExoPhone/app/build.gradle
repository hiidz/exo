plugins {
    id 'com.android.application'
}

android {
    namespace = 'exo.phone'

    // AGP 9 DSL: compileSdk is a block.
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = 'exo.phone'
        // KEY_LOW_LATENCY is API 30 and is guarded at runtime.
        minSdk = 29
        targetSdk = 37
        versionCode = 1
        versionName = '1.0.0'
    }

    // The release key: its keystore and password come
    // from the environment, set by src/ExoSetup/release.ps1, never the repo.
    // Without them assembleRelease fails rather than ship an unsigned APK.
    signingConfigs {
        release {
            storeFile = System.getenv('EXO_KEYSTORE') ? file(System.getenv('EXO_KEYSTORE')) : null
            storePassword = System.getenv('EXO_KEYSTORE_PASSWORD')
            keyAlias = 'exo'
            keyPassword = System.getenv('EXO_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// No dependencies on purpose: framework classes only, no AndroidX.
